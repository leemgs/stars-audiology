# KNHANES variable mapping for STARS.
# ---------------------------------------------------------------------------
# KNHANES raw microdata require official KDCA approval and cannot be
# redistributed. The otology/audiometry examination (ENT exam: pure-tone
# audiometry + tinnitus/hearing questions) was fielded in KNHANES IV-2..V-3,
# i.e., survey years 2008-2012; STARS uses 2010-2012 (KNHANES V-1, V-2, V-3).
#
# CONFIDENCE TAGS on each field:
#   [CONFIRMED] widely-used KNHANES code, stable across these cycles.
#   [LIKELY]    strong candidate from published KNHANES ENT studies -- confirm.
#   [VERIFY]    plausible but cycle-dependent -- must confirm in the codebook.
#   [FILL]      no reliable default -- you must set it from the codebook.
# The loader skips any field left as <FILL> or naming a column not in the data,
# and prints a "Derived-variable coverage" report so mismatches surface loudly.
#
# Unlike NHANES, KNHANES carries a general perceived-stress item (BP1), so this
# is where STARS's PRIMARY perceived-stress exposure is tested.
# ---------------------------------------------------------------------------

survey_design:
  # VERIFIED against the real HN10/11/12_ALL files: wt_itvex (설문,검진 통합
  # 가중치) is present and correct for the interview+exam analysis; pool 2010-2012
  # by dividing it by the number of years (wt_itvex/3) per KDCA guidance.
  # NOTE: the ENT/otology exam is a ">=40 subsample"; the audiometry-specific
  # subsample weight is expected to live IN THE SEPARATE ENT FILE (not the ALL
  # file). Switch `weight` to that ENT weight once the ENT file is supplied.
  weight: wt_itvex        # [CONFIRMED in ALL file] 설문,검진 통합가중치 (pool: /n_years)
  strata: kstrata         # [CONFIRMED] variance estimation stratum
  psu: psu                # [CONFIRMED] primary sampling unit

common:
  age: age                # [CONFIRMED] age in years
  sex: sex                # [CONFIRMED] 1 = male, 2 = female
  education: edu          # [CONFIRMED] education level (categorical)
  income: ho_incm         # [CONFIRMED] household income quartile (ho_incm5 = quintile)
  occupation: occp        # [CONFIRMED] occupation group (reclassified)
  employment: EC_stt_1    # [LIKELY] economic-activity/employment status

exposure:
  perceived_stress: BP1           # [CONFIRMED] 평소 스트레스 인지: 1=대단히 많이,2=많이,3=조금,4=거의 안 느낌
  stress_high_values: [1, 2]      # dichotomize "high perceived stress" = codes 1-2

mediators:
  # PHQ-9 exists only from 2014 onward (mh_PHQ_01..09 / mh_PHQ_S); for 2010-2012
  # use the single 2-week depressed-mood item instead.
  depression_phq9_items: []       # [n/a for 2010-2012] e.g., [mh_PHQ_01, ..., mh_PHQ_09]
  depressed_2wk: BP5              # [CONFIRMED] 최근 1년 2주 이상 연속 우울감: 1=예, 2=아니오
  sleep_hours: <FILL>            # [FILL] sleep-duration var not standardized in 2010-2012 (optional; mediator only)

outcomes:
  # ** VERIFIED ABSENT from the HN{yy}_ALL "기본DB" files. ** Inspection of the
  # real 2010-2012 ALL files found NO tinnitus/noise/audiometry variables (the
  # "HtE_"/"O_R_###" guesses below do not exist there -- "O_*" columns are the
  # ORAL/dental exam). The ENT exam (순음청력 + 이명 + 소음), fielded on adults
  # >=40, is a SEPARATE file that must be downloaded and merged on `id`.
  # The names below are UNCONFIRMED placeholders pending that ENT file's codebook.
  tinnitus_item: <FILL>           # [PENDING ENT FILE] 최근 1년 이명 경험 item
  tinnitus_yes_values: [1]
  bothersome_item: <FILL>         # [PENDING ENT FILE] bothersome-tinnitus item
  bothersome_yes_values: [2, 3]
  occupational_noise: <FILL>      # [PENDING ENT FILE] 직업적/작업장 소음 노출 item

# Pure-tone air-conduction thresholds (dB HL) per frequency: [right_var, left_var]
# ** PENDING ENT FILE. ** The O_R_###/O_L_### names below are NOT in the ALL file
# (O_* there is dental). Set these from the ENT/audiometry file's codebook.
audiometry:
  "500":  [<FILL>, <FILL>]
  "1000": [<FILL>, <FILL>]
  "2000": [<FILL>, <FILL>]
  "3000": [<FILL>, <FILL>]
  "4000": [<FILL>, <FILL>]
  "6000": [<FILL>, <FILL>]
speech_freqs: ["500", "1000", "2000", "4000"]
invalid_threshold_codes: [99999, 66666]   # [PENDING ENT FILE] non-response codes -- confirm

# Raw files per cycle (KDCA files, placed locally under data-dir; not committed).
# `exam` = the "기본DB" HN{yy}_ALL file (VERIFIED present: stress BP1 + covariates,
#          but NO hearing outcomes). `ent` = the separate ENT/audiometry file
#          (still to be downloaded); the loader merges `ent` into `exam` on `id`.
files:
  "2010": {exam: hn10_all.sas7bdat, ent: <FILL_ENT_2010>}
  "2011": {exam: hn11_all.sas7bdat, ent: <FILL_ENT_2011>}
  "2012": {exam: hn12_all.sas7bdat, ent: <FILL_ENT_2012>}

analysis:
  age_min: 40
  age_max: 69
  hearing_loss_cutoff_db: 25
